<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E5E6F">
<title>You're offline · Den</title>
<style>
  :root { --paper: #FFFFFF; --ink: #172033; --muted: #566274; --teal: #0E5E6F; }
  @media (prefers-color-scheme: dark) { :root { --paper: #0F171D; --ink: #E6EDF1; --muted: #9AA8B4; --teal: #62B9CA; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; background: var(--paper); color: var(--ink);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; text-align: center; }
  .logo { font-family: Georgia, 'Times New Roman', serif; font-weight: 900; font-size: 44px; letter-spacing: -.04em; }
  .logo span { color: #F4A340; }
  h1 { font-family: Georgia, 'Times New Roman', serif; font-size: 26px; margin: 18px 0 8px; }
  p { color: var(--muted); max-width: 320px; margin: 0 auto 20px; line-height: 1.5; }
  button { height: 48px; padding: 0 26px; border: none; border-radius: 12px; background: var(--teal); color: #fff; font: inherit; font-weight: 700; font-size: 16px; }
</style>
</head>
<body>
  <main>
    <div class="logo">Den<span>.</span></div>
    <h1>You're offline</h1>
    <p>Den needs the internet to show your college's posts. Check your mobile data or WiFi, then try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
